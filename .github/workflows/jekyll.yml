# Workflow for building and deploying Junteng Liu's academic homepage to GitHub Pages
name: Deploy Junteng Liu's homepage to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Set site base path
        id: pages
        run: echo "base_path=/LJT-Homepage" >> "$GITHUB_OUTPUT"
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Verify homepage and publication output
        run: |
          set -e
          grep -qF "Junteng Liu" _site/index.html
          grep -qF "MINIMAX" _site/index.html
          grep -qF "jliugi@connect.ust.hk" _site/index.html
          grep -qF "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" _site/index.html
          grep -qF "On the Perception Bottleneck of VLMs for Chart Understanding" _site/index.html
          grep -qF "On the Universal Truthfulness Hyperplane Inside LLMs" _site/index.html
          grep -qF "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" _site/index.html
          grep -qF "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" _site/index.html
          grep -qF "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/index.html
          grep -qF "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" _site/publications/index.html
          grep -qF "On the Perception Bottleneck of VLMs for Chart Understanding" _site/publications/index.html
          grep -qF "On the Universal Truthfulness Hyperplane Inside LLMs" _site/publications/index.html
          grep -qF "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" _site/publications/index.html
          grep -qF "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" _site/publications/index.html
          grep -qF "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/publications/index.html
          test "$(grep -o 'archive__item-title' _site/publications/index.html | wc -l)" -eq 6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
